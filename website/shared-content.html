<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>תוכן משותף - NewsHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-3 mb-4">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0"><i class="fas fa-filter me-2"></i>סינונים</h5>
            </div>
            <div class="card-body">
              <!-- Search -->
              <div class="mb-3">
                <label for="searchInput" class="form-label">חיפוש</label>
                <input
                  type="text"
                  class="form-control"
                  id="searchInput"
                  placeholder="חפש בתוכן משותף..."
                />
              </div>
              <!-- Blocked users -->
              <div class="mb-3">
                <h6>משתמשים חסומים</h6>
                <div id="blockedUsers">
                  <!-- Blocked users will be loaded here -->
                </div>
                <button
                  class="btn btn-sm btn-outline-secondary mt-2"
                  onclick="openBlockUserModal()"
                >
                  <i class="fas fa-ban me-1"></i>חסום משתמש
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-share-alt me-2"></i>תוכן משותף</h2>
            <button class="btn btn-primary" onclick="openShareModal()">
              <i class="fas fa-plus me-2"></i>שתף תוכן
            </button>
          </div>

          <!-- Loading Spinner -->
          <div
            id="loadingSpinner"
            class="text-center py-5"
            style="display: none"
          >
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">טוען...</span>
            </div>
            <p class="mt-2">טוען תוכן משותף...</p>
          </div>

          <!-- Shared Content Container -->
          <div id="sharedContentContainer">
            <!-- Shared content will be loaded here -->
          </div>

          <!-- Pagination -->
          <nav aria-label="ניווט דפים" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
              <!-- Pagination will be loaded here -->
            </ul>
          </nav>
        </div>
      </div>
    </div>

    <!-- Share Content Modal -->
    <div class="modal fade" id="shareModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">שתף תוכן</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="shareForm">
              <div class="mb-3">
                <label for="articleUrl" class="form-label">קישור לכתבה</label>
                <input
                  type="url"
                  class="form-control"
                  id="articleUrl"
                  placeholder="https://..."
                  required
                />
                <div class="form-text">הדבק קישור לכתבה שברצונך לשתף</div>
              </div>
              <div class="mb-3">
                <label for="shareComment" class="form-label">התגובה שלך</label>
                <textarea
                  class="form-control"
                  id="shareComment"
                  rows="4"
                  placeholder="כתב את המחשבות שלך על הכתבה..."
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              ביטול
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="submitShare()"
            >
              שתף
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Block User Modal -->
    <div class="modal fade" id="blockUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">חסום משתמש</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="userToBlock" class="form-label"
                >בחר משתמש לחסימה</label
              >
              <select class="form-select" id="userToBlock" required>
                <option value="">בחר משתמש...</option>
                <!-- Users will be populated dynamically -->
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              ביטול
            </button>
            <button type="button" class="btn btn-danger" onclick="blockUser()">
              חסום
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Report Content Modal -->
    <div class="modal fade" id="reportModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-warning">
          <div class="modal-header bg-warning bg-opacity-10">
            <h5 class="modal-title text-warning">
              <i class="fas fa-exclamation-triangle me-2"></i>
              דווח על תוכן פוגעני
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center py-4">
            <div class="mb-4">
              <i class="fas fa-flag text-danger" style="font-size: 3rem"></i>
            </div>
            <h6 class="mb-3">האם אתה בטוח שברצונך לדווח על התוכן הזה?</h6>
            <p class="text-muted mb-4">
              הדיווח יישלח למנהלי המערכת לבדיקה.<br />
              תוכן פוגעני יוסר מהמערכת.
            </p>
            <div class="alert alert-info">
              <i class="fas fa-info-circle me-2"></i>
              <small>דיווחים כוזבים עלולים להוביל לחסימת החשבון</small>
            </div>
          </div>
          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-outline-secondary me-2"
              data-bs-dismiss="modal"
            >
              <i class="fas fa-times me-1"></i>
              ביטול
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="submitReport()"
            >
              <i class="fas fa-flag me-1"></i>
              שלח דיווח
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ajaxCalls.js"></script>
    <script src="js/auth-jwt.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/news-utils.js"></script>
    <script src="js/shared-content.js"></script>

    <script>
      // Initialize theme on page load
      $(document).ready(function () {
        if (typeof Utils !== "undefined" && Utils.darkMode) {
          Utils.darkMode.init();
        }
      });
    </script>
  </body>
</html>
