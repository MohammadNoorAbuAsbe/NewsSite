<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-signin-client_id"
      content="946684394155-egcnu1sk9d8fnr6qu4e75jhhjbb8010u.apps.googleusercontent.com"
    />
    <title>התחברות - NewsHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .google-signin-container {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .google-signin-container > div {
        width: 100% !important;
        max-width: 100% !important;
      }
    </style>
  </head>
  <body class="auth-body">
    <div class="container-fluid h-100">
      <div class="row h-100">
        <div class="col-lg-6 auth-left d-none d-lg-block">
          <div class="auth-content">
            <h2 class="text-white mb-4">ברוכים השבים ל-NewsHub</h2>
            <p class="text-white-50">
              התחבר כדי לגשת לחדשות המותאמות אישית שלך
            </p>
          </div>
        </div>
        <div class="col-lg-6 auth-right d-flex align-items-center">
          <div class="w-100">
            <div class="auth-form-container">
              <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none">
                  <h3 class="text-primary">
                    <i class="fas fa-newspaper me-2"></i>NewsHub
                  </h3>
                </a>
                <h4 class="fw-normal">התחברות</h4>
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label for="email" class="form-label">אימייל</label>
                  <input type="text" class="form-control" id="email" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">סיסמה</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                  התחבר
                </button>
              </form>

              <!-- Google Sign-In Section -->
              <div class="text-center mb-3">
                <div class="d-flex align-items-center mb-3">
                  <hr class="flex-grow-1" />
                  <span class="mx-3 text-muted">או</span>
                  <hr class="flex-grow-1" />
                </div>

                <!-- Hidden div for Google One Tap -->
                <div
                  id="g_id_onload"
                  data-client_id="946684394155-egcnu1sk9d8fnr6qu4e75jhhjbb8010u.apps.googleusercontent.com"
                  data-callback="handleCredentialResponse"
                ></div>

                <!-- Google Sign-In Button -->
                <div class="google-signin-container">
                  <div
                    class="g_id_signin"
                    data-type="standard"
                    data-theme="outline"
                    data-size="large"
                    data-text="signin_with"
                    data-shape="rectangular"
                    data-logo_alignment="left"
                  ></div>
                </div>
              </div>

              <div class="text-center">
                <p class="mb-0">
                  אין לך חשבון?
                  <a href="register.html" class="text-primary">הירשם כאן</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert Container -->
    <div
      id="alertContainer"
      class="position-fixed top-0 start-50 translate-middle-x mt-3"
      style="z-index: 1050"
    ></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ajaxCalls.js"></script>
    <script src="js/auth-jwt.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/login.js"></script>

    <script>
      // Handle Google Sign-In response
      async function handleCredentialResponse(response) {

        // Wait for ajaxCall to be available (not apiCall)
        const waitForAjaxCall = () => {
          return new Promise((resolve) => {
            if (typeof ajaxCall !== "undefined") {
              resolve();
            } else {
              const checkInterval = setInterval(() => {
                if (typeof ajaxCall !== "undefined") {
                  clearInterval(checkInterval);
                  resolve();
                }
              }, 100);
            }
          });
        };

        try {
          // Wait for dependencies to load
          await waitForAjaxCall();


          // Use the correct server URL for Google login
          const googleLoginUrl = `https://localhost:7259/api/users/google-login`;

          // Use ajaxCall with callback functions instead of await
          ajaxCall(
            "POST",
            googleLoginUrl,
            JSON.stringify({ idToken: response.credential }),
            function (result) {

              if (result && result.accessToken) {
                // Store the token (same format as traditional login)
                localStorage.setItem("jwtToken", result.accessToken);
                localStorage.setItem("refreshToken", result.refreshToken);
                localStorage.setItem(
                  "currentUser",
                  JSON.stringify(result.user)
                );

                // Show success message
                if (typeof authManager !== "undefined") {
                  authManager.showAlert(
                    "התחברות הצליחה! מעביר אותך...",
                    "success"
                  );
                } else {
                  alert("התחברות הצליחה! מעביר אותך...");
                }

                // Redirect to main page
                setTimeout(() => {
                  window.location.href = "index.html";
                }, 1500);
              } else {
                console.error(
                  "Login failed - no access token received:",
                  result
                );
                if (typeof authManager !== "undefined") {
                  authManager.showAlert("התחברות Google נכשלה", "danger");
                } else {
                  alert("Google login failed");
                }
              }
            },
            function (xhr, status, error) {
              console.error("Google login error:", error);
              console.error("Error details:", xhr.responseText);
              if (typeof authManager !== "undefined") {
                authManager.showAlert(
                  "התחברות Google נכשלה: " + error,
                  "danger"
                );
              } else {
                alert("Google login failed: " + error);
              }
            }
          );
        } catch (error) {
          console.error("Google login setup error:", error);
          if (typeof authManager !== "undefined") {
            authManager.showAlert(
              "שגיאה בהכנת התחברות Google: " + error.message,
              "danger"
            );
          } else {
            alert("Google login setup failed: " + error.message);
          }
        }
      }

      // Initialize theme on page load
      $(document).ready(function () {

        // Test if ajaxCall is in global scope after a delay

        if (typeof Utils !== "undefined" && Utils.darkMode) {
          Utils.darkMode.init();
        }
      });
    </script>
  </body>
</html>
