<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>רישום - NewsHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <div class="container-fluid h-100">
      <div class="row h-100">
        <div class="col-lg-6 auth-left d-none d-lg-block">
          <div class="auth-content">
            <h2 class="text-white mb-4">הצטרף ל-NewsHub</h2>
            <p class="text-white-50">
              צור חשבון חדש וקבל גישה לחדשות מותאמות אישית
            </p>
          </div>
        </div>
        <div class="col-lg-6 auth-right d-flex align-items-center">
          <div class="w-100">
            <div class="auth-form-container">
              <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none">
                  <h3 class="text-primary">
                    <i class="fas fa-newspaper me-2"></i>NewsHub
                  </h3>
                </a>
                <h4 class="fw-normal">יצירת חשבון חדש</h4>
              </div>

              <form id="registerForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">שם פרטי</label>
                    <input
                      type="text"
                      class="form-control"
                      id="firstName"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">שם משפחה</label>
                    <input
                      type="text"
                      class="form-control"
                      id="lastName"
                      required
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">אימייל</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">סיסמה</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                  />
                  <div class="form-text">הסיסמה חייבת להכיל לפחות 6 תווים</div>
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >אישור סיסמה</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                  צור חשבון
                </button>
              </form>

              <div class="text-center">
                <p class="mb-0">
                  יש לך כבר חשבון?
                  <a href="login.html" class="text-primary">התחבר כאן</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert Container -->
    <div
      id="alertContainer"
      class="position-fixed top-0 start-50 translate-middle-x mt-3"
      style="z-index: 1050"
    ></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ajaxCalls.js"></script>
    <script src="js/auth-jwt.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/register.js"></script>

    <script>
      // Initialize theme on page load
      $(document).ready(function () {
        if (typeof Utils !== "undefined" && Utils.darkMode) {
          Utils.darkMode.init();
        }
      });
    </script>
  </body>
</html>
