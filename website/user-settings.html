<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הגדרות משתמש - NewsHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row">
        <div class="col-md-3">
          <!-- Settings Navigation -->
          <div class="card">
            <div class="card-header">
              <h5><i class="fas fa-cog me-2"></i>הגדרות</h5>
            </div>
            <div class="list-group list-group-flush">
              <a
                href="#profile"
                class="list-group-item list-group-item-action active"
                onclick="showSection('profile')"
              >
                <i class="fas fa-user me-2"></i>פרופיל
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-9">
          <!-- Profile Settings -->
          <div id="profileSection" class="settings-section">
            <div class="card">
              <div class="card-header">
                <h5><i class="fas fa-user me-2"></i>פרטי פרופיל</h5>
              </div>
              <div class="card-body">
                <form id="profileForm">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="firstName" class="form-label">שם פרטי</label>
                      <input
                        type="text"
                        class="form-control"
                        id="firstName"
                        required
                      />
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="lastName" class="form-label">שם משפחה</label>
                      <input
                        type="text"
                        class="form-control"
                        id="lastName"
                        required
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">כתובת אימייל</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      readonly
                    />
                    <div class="form-text">לא ניתן לשנות את כתובת האימייל</div>
                  </div>
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>שמור שינויים
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert Container -->
    <div
      id="alertContainer"
      class="position-fixed top-0 start-50 translate-middle-x mt-3"
      style="z-index: 1050"
    ></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ajaxCalls.js"></script>
    <script src="js/auth-jwt.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/user-settings.js"></script>

    <script>
      // Initialize theme on page load
      $(document).ready(function () {
        if (typeof Utils !== "undefined" && Utils.darkMode) {
          Utils.darkMode.init();
        }
      });
    </script>
  </body>
</html>
